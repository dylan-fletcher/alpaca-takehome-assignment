name: btc_backtest
version: "1.0.0"
profile: btc_backtest

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  btc_backtest:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # Table, not view: this is the one model that scans all 110M seconds.
      # As a view every downstream fact, test and ad-hoc query would repeat
      # that scan; as a table it is paid once for ~30.7k rows.
      +materialized: table
      +schema: intermediate
    facts:
      +materialized: table
      +schema: facts

vars:
  # Overridable at run time:  dbt build --vars '{trade_hour: 15}'
  trade_hour: null          # null = evaluate all 24 hours
  initial_units: 1
