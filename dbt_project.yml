name: btc_backtest
version: "1.0.0"
profile: btc_backtest

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  btc_backtest:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # Table, not view: this is the one model that scans all 110M seconds.
      # As a view every downstream fact, test and ad-hoc query would repeat
      # that scan; as a table it is paid once for ~30.7k rows.
      +materialized: table
      +schema: intermediate
    facts:
      +materialized: table
      +schema: facts

vars:
  # Overridable at run time:  dbt build --vars '{trade_hour: 15}'
  trade_hour: null          # null = evaluate all 24 hours
  trade_day_of_week: null   # null = every day; else ISO 1=Monday .. 7=Sunday
  initial_units: 1

  # The backtest window. 2021-02-23 is deliberately excluded: the file starts
  # at 09:20:20 that day, so hours 10-23 could trade it and hours 00-09 could
  # not. Including it would give the later hours a free extra trade in a
  # ranking that compares all 24 against each other.
  backtest_start_date: "2021-02-24"
  backtest_end_date: null   # null = run to the end of the data
