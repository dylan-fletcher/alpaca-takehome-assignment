name: btc_backtest

services:
  postgres:
    image: postgres:16
    container_name: btc_backtest_db
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: bitcoin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d bitcoin"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
