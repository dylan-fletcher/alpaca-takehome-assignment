name: btc_backtest

services:
  postgres:
    image: postgres:16
    container_name: btc_backtest_db
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: bitcoin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The dataset is assumed to sit in the repo root at run time (per the
      # assignment brief) and is never committed. Mounted read-only so the
      # Postgres backend can COPY from it directly.
      # CSV_FILE lets run.sh point the load at a smaller fixture for testing,
      # and at /dev/null when there is no dataset to mount at all. A source
      # that does not exist is worse than useless here: Compose would create a
      # root-owned directory at that path rather than failing.
      - ${CSV_FILE:-./half2_BTCUSDT_1s.csv}:/data/dataset.csv:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d bitcoin"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
