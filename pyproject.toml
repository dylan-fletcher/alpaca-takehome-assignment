[project]
name = "alpaca-takehome-assignment"
version = "0.1.0"
description = "Hourly BTCUSDT backtest over Binance 1-second data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.3",
    "dbt-postgres>=1.11.0",
    "matplotlib>=3.11.1",
    "psycopg2-binary>=2.9.12",
    "sqlparse>=0.6.0",
    "tabulate>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Only the Python half. dbt's own tests live in tests/*.sql and are run by
# `dbt build`, which pytest knows nothing about.
testpaths = ["tests/python"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "sqlfluff>=4.3.0",
]
